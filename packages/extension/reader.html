<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lang &amp; rund</title>
  </head>
  <body>
    <div id="app" class="app theme-sepia mode-antiqua measure-medium">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="Lesemodus">
        <div class="toolbar-group">
          <div class="toolbar-close-group">
            <button type="button" id="btn-close" class="btn" title="Schließen (Esc)" aria-label="Schließen (Esc)">✕</button>
            <kbd class="drawer-esc-hint" title="Schließen mit Escape">Esc</kbd>
          </div>
        </div>
        <div class="toolbar-group toolbar-controls">
          <label class="ctrl">
            Schrift
            <select id="display-mode" aria-label="Darstellung" class="select">
              <option value="antiqua">Antiqua</option>
              <option value="fraktur">Fraktur</option>
              <option value="kurrent">Kurrent</option>
            </select>
          </label>
          <label class="ctrl">
            Zeile
            <select id="measure" aria-label="Textbreite" class="select">
              <option value="narrow">Schmal</option>
              <option value="medium">Mittel</option>
              <option value="wide">Breit</option>
            </select>
          </label>
          <label class="ctrl">
            Thema
            <select id="theme" aria-label="Farbschema" class="select">
              <option value="light">Hell</option>
              <option value="sepia" selected>Sepia</option>
              <option value="graphite">Graphit</option>
              <option value="dark">Dunkel</option>
            </select>
          </label>
          <div class="ctrl">
            <span class="ctrl-label" id="size-label">Größe</span>
            <div class="font-size-ctrl" role="group" aria-labelledby="size-label">
              <button type="button" id="font-minus" class="btn" aria-label="Kleiner">A−</button>
              <button type="button" id="font-plus" class="btn" aria-label="Größer">A+</button>
            </div>
          </div>
          <label class="ctrl">
            Bilder aus
            <button
              type="button"
              id="text-only-toggle"
              class="switch"
              role="switch"
              aria-checked="true"
              title="Bilder und Medien ausblenden"
            >
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </button>
          </label>
          <label class="ctrl">
            Tooltip
            <button
              type="button"
              id="word-tooltip-toggle"
              class="switch"
              role="switch"
              aria-checked="true"
              title="Wort-Tooltip"
            >
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </button>
          </label>
        </div>
      </header>

      <div class="reader-shell">
        <main class="reader">
          <p id="meta" class="meta"></p>
          <h1 id="title" class="title"></h1>
          <article id="content" class="content"></article>
          <p id="ambiguity-hint" class="hint hidden">
            Gepunktet unterstrichene Wörter: Wortfuge unklar — Klick öffnet den Lern-Drawer mit Varianten.
            Hover zeigt jedes Wort modern geschrieben (abschaltbar über „Tooltip“).
          </p>
        </main>

        <aside
          id="learn-drawer"
          class="learn-drawer"
          aria-hidden="true"
          aria-label="Lernhinweise zum Wort"
        >
          <header class="drawer-toolbar">
            <h2 class="drawer-title">Wort lernen</h2>
            <div class="drawer-close-group">
              <kbd class="drawer-esc-hint" title="Schließen mit Escape">Esc</kbd>
              <button type="button" id="drawer-close" class="btn" aria-label="Drawer schließen (Esc)">✕</button>
            </div>
          </header>
          <div id="drawer-body" class="drawer-body"></div>
        </aside>
      </div>

      <div id="word-tooltip" class="word-tooltip" hidden role="tooltip"></div>
      <div id="toast" class="toast" role="status"></div>
      <footer id="app-footer" class="app-footer">
        <a href="https://github.com/MarkusGerke/lang-und-rund" target="_blank" rel="noopener">Repo</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="impressum.html">Impressum</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="https://x.com/MarkusGerke" target="_blank" rel="noopener"
          ><span class="x-logo" aria-hidden="true"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.259 5.698L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg></span
          ><span class="x-handle">MarkusGerke</span></a
        >
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <span class="app-version">v1.0.0</span>
      </footer>
    </div>
    <script type="module" src="/src/reader/reader.ts"></script>
  </body>
</html>
