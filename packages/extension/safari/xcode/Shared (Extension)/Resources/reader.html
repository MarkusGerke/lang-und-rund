<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>lang &amp; rund</title>
    <script type="module" crossorigin src="./assets/reader-D2UJNPrh.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/feedback-Rg9i01ug.js">
    <link rel="modulepreload" crossorigin href="./assets/drawerRender-fMQdznrl.js">
    <link rel="stylesheet" crossorigin href="./assets/reader-BLFiaw6B.css">
  </head>
  <body>
    <div id="app" class="app theme-sepia mode-fraktur measure-medium">
      <header id="toolbar" class="toolbar" role="toolbar" aria-label="Lesemodus">
        <div class="toolbar-start">
          <div class="toolbar-group toolbar-close-wrap">
            <div class="toolbar-close-group">
              <button type="button" id="btn-close" class="btn" title="Schließen (Esc)" aria-label="Schließen (Esc)">✕</button>
            </div>
          </div>
          <kbd class="drawer-esc-hint" title="Schließen mit Escape">Esc</kbd>
          <p class="toolbar-brand">lang &amp; rund</p>
        </div>
        <button
          type="button"
          id="btn-edit-mode"
          class="btn toolbar-edit-btn"
          hidden
          aria-pressed="false"
        >
          Bearbeiten
        </button>
        <details class="toolbar-settings">
          <summary class="toolbar-settings-summary">
            <span>Einstellungen</span>
            <span class="toolbar-settings-chevron" aria-hidden="true"></span>
          </summary>
          <div class="toolbar-group toolbar-controls">
            <div class="ctrl">
              <span class="ctrl-label">Schriftart</span>
              <div
                class="segment"
                id="display-mode"
                role="group"
                aria-label="Schriftart"
              >
                <button type="button" class="segment-btn" data-value="antiqua">
                  Antiqua
                </button>
                <button
                  type="button"
                  class="segment-btn is-active"
                  data-value="fraktur"
                  aria-pressed="true"
                >
                  Fraktur
                </button>
                <button type="button" class="segment-btn" data-value="kurrent">
                  Kurrent
                </button>
                <button type="button" class="segment-btn" data-value="suetterlin">
                  Sütterlin
                </button>
              </div>
            </div>
            <label class="ctrl ctrl-measure">
              Absatzbreite
              <select id="measure" aria-label="Textbreite" class="select">
                <option value="narrow">Schmal</option>
                <option value="medium">Mittel</option>
                <option value="wide">Breit</option>
              </select>
            </label>
            <div class="ctrl">
              <span class="ctrl-label" id="leading-label">Zeilenabstand</span>
              <div
                class="font-size-ctrl"
                id="leading"
                role="group"
                aria-labelledby="leading-label"
              >
                <button
                  type="button"
                  id="leading-minus"
                  class="btn"
                  aria-label="Enger"
                >
                  −
                </button>
                <button
                  type="button"
                  id="leading-plus"
                  class="btn"
                  aria-label="Weiter"
                >
                  +
                </button>
              </div>
            </div>
            <div class="ctrl">
              <span class="ctrl-label">Farbwahl</span>
              <div
                class="theme-cubes"
                id="theme"
                role="group"
                aria-label="Farbschema"
              >
                <button
                  type="button"
                  class="theme-cube theme-cube-light"
                  data-value="light"
                  aria-label="Hell"
                >
                  <span class="theme-cube-letter" aria-hidden="true">ſ</span>
                </button>
                <button
                  type="button"
                  class="theme-cube theme-cube-sepia is-active"
                  data-value="sepia"
                  aria-label="Sepia"
                  aria-pressed="true"
                >
                  <span class="theme-cube-letter" aria-hidden="true">ſ</span>
                </button>
                <button
                  type="button"
                  class="theme-cube theme-cube-graphite"
                  data-value="graphite"
                  aria-label="Graphit"
                >
                  <span class="theme-cube-letter" aria-hidden="true">ſ</span>
                </button>
                <button
                  type="button"
                  class="theme-cube theme-cube-dark"
                  data-value="dark"
                  aria-label="Dunkel"
                >
                  <span class="theme-cube-letter" aria-hidden="true">ſ</span>
                </button>
              </div>
            </div>
            <div class="ctrl">
              <span class="ctrl-label" id="size-label">Schriftgröße</span>
              <div class="font-size-ctrl" role="group" aria-labelledby="size-label">
                <button type="button" id="font-minus" class="btn" aria-label="Kleiner">A−</button>
                <button type="button" id="font-plus" class="btn" aria-label="Größer">A+</button>
              </div>
            </div>
            <label class="ctrl">
              Medien ausblenden
              <button
                type="button"
                id="text-only-toggle"
                class="switch"
                role="switch"
                aria-checked="true"
                title="Bilder, Videos und Embeds (z. B. Tweets) ausblenden"
              >
                <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              </button>
            </label>
          </div>
        </details>
      </header>

      <div class="reader-shell">
        <main class="reader">
          <p id="meta" class="meta"></p>
          <input
            id="editor-title"
            class="title title-edit host-only"
            type="text"
            placeholder="Titel (optional)"
            autocomplete="off"
          />
          <div class="live-stack host-only">
            <article id="content-host" class="content" aria-live="polite"></article>
            <div
              id="editor-body"
              class="content content-edit"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              data-placeholder="Text einfügen oder schreiben…"
            ></div>
          </div>
          <h1 id="title" class="title"></h1>
          <article id="content" class="content"></article>
          <p id="ambiguity-hint" class="hint hidden">
            Mit Hintergrund und gestrichelter Linie markierte Wörter: Wortfuge unklar —
            Klick öffnet den Lern-Drawer mit Varianten.
          </p>
        </main>

        <aside
          id="learn-drawer"
          class="learn-drawer"
          aria-hidden="true"
          aria-label="Lernhinweise zum Wort"
        >
          <header class="drawer-toolbar">
            <div class="drawer-resize-handle" id="drawer-resize-handle" role="separator" aria-orientation="horizontal" aria-label="Drawer-Höhe anpassen" title="Ziehen zum Anpassen · Doppeltipp: Standardhöhe"></div>
            <h2 class="drawer-title">Wort lernen</h2>
            <div class="drawer-close-group">
              <kbd class="drawer-esc-hint" title="Schließen mit Escape">Esc</kbd>
              <button type="button" id="drawer-close" class="btn" aria-label="Drawer schließen (Esc)">✕</button>
            </div>
          </header>
          <div id="drawer-body" class="drawer-body"></div>
        </aside>
      </div>

      <div id="toast" class="toast" role="status"></div>
      <footer id="app-footer" class="app-footer">
        <a href="https://github.com/MarkusGerke/lang-und-rund" target="_blank" rel="noopener">Github</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="impressum.html">Impressum</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="https://x.com/MarkusGerke" target="_blank" rel="noopener"
          ><span class="x-logo" aria-hidden="true"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.259 5.698L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg></span
          ><span class="x-handle">MarkusGerke</span></a
        >
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <span class="app-version">v1.0.0</span>
      </footer>
    </div>
  </body>
</html>
