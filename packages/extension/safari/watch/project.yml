name: LangUndRundWatch
options:
  bundleIdPrefix: de.langundrund
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    MARKETING_VERSION: "1.3.4"
    CURRENT_PROJECT_VERSION: "134"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    DEAD_CODE_STRIPPING: YES
targets:
  LangUndRundWatchCompanion:
    type: application
    platform: iOS
    sources:
      - path: Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.langundrund.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "lang & rund Watch"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SDKROOT: iphoneos
    dependencies:
      - target: LangUndRundWatch
        embed: true

  LangUndRundWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/*.md"
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.langundrund.watch.watchkitapp
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "lang & rund"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.3.4"
        INFOPLIST_KEY_CFBundleVersion: "134"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.langundrund.watch
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos

schemes:
  LangUndRundWatch:
    build:
      targets:
        LangUndRundWatchCompanion: all
        LangUndRundWatch: all
    run:
      config: Debug
      executable: LangUndRundWatchCompanion
