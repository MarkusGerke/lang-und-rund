<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lang &amp; rund – Optionen</title>
  </head>
  <body>
    <main id="app" class="options">
      <h1>lang &amp; rund</h1>
      <p class="lead">Einstellungen werden synchronisiert, sofern der Browser das erlaubt.</p>
      <nav class="options-legal" aria-label="Rechtliches">
        <a href="https://github.com/MarkusGerke/lang-und-rund" target="_blank" rel="noopener">Repo</a>
        <span aria-hidden="true">·</span>
        <a href="impressum.html">Impressum</a>
        <span aria-hidden="true">·</span>
        <a href="https://x.com/MarkusGerke" target="_blank" rel="noopener"
          ><span class="x-logo" aria-hidden="true"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.259 5.698L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg></span
          ><span class="x-handle">MarkusGerke</span></a
        >
        <span aria-hidden="true">·</span>
        <span class="app-version">v1.0.0</span>
      </nav>

      <label class="field">
        Standard-Darstellung
        <select id="display-mode" class="select">
          <option value="antiqua">Antiqua</option>
          <option value="fraktur">Fraktur</option>
          <option value="kurrent">Kurrent</option>
        </select>
      </label>

      <label class="field">
        Textbreite
        <select id="measure" class="select">
          <option value="narrow">Schmal</option>
          <option value="medium">Mittel</option>
          <option value="wide">Breit</option>
        </select>
      </label>

      <label class="field">
        Farbschema
        <select id="theme" class="select">
          <option value="light">Hell</option>
          <option value="sepia" selected>Sepia</option>
          <option value="graphite">Graphit</option>
          <option value="dark">Dunkel</option>
        </select>
      </label>

      <fieldset class="field-set">
        <legend>Standard-Schriftgrößen (px)</legend>
        <label class="field inline">
          Antiqua
          <input id="size-antiqua" type="number" min="14" max="48" step="2" />
        </label>
        <label class="field inline">
          Fraktur
          <input id="size-fraktur" type="number" min="14" max="48" step="2" />
        </label>
        <label class="field inline">
          Kurrent
          <input id="size-kurrent" type="number" min="14" max="80" step="2" />
        </label>
      </fieldset>

      <label class="field">
        Sprach-Override
        <select id="force-german" class="select">
          <option value="auto">Automatisch (lang + Heuristik)</option>
          <option value="yes">Immer als Deutsch behandeln</option>
          <option value="no">Nie konvertieren (blockieren)</option>
        </select>
      </label>

      <p class="hint">
        Tastenkürzel: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
        (unter Erweiterungs-Shortcuts änderbar).
      </p>

      <p id="status" class="status" hidden></p>

      <footer id="options-footer" class="app-footer options-footer">
        <a href="https://github.com/MarkusGerke/lang-und-rund" target="_blank" rel="noopener">Repo</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="impressum.html">Impressum</a>
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <a href="https://x.com/MarkusGerke" target="_blank" rel="noopener"
          ><span class="x-logo" aria-hidden="true"
            ><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.727-8.835L1.254 2.25H8.08l4.259 5.698L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg></span
          ><span class="x-handle">MarkusGerke</span></a
        >
        <span class="app-footer-sep" aria-hidden="true">·</span>
        <span class="app-version">v1.0.0</span>
      </footer>
    </main>
    <script type="module" src="/src/options/options.ts"></script>
  </body>
</html>
